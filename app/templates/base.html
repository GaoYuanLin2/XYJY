<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}校园集市{% endblock %} · 先跑再说</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('items.index') }}">校园集市</a>
  <nav>
    <a href="{{ url_for('items.index') }}">逛集市</a>
    {% if g.user %}
      <a href="{{ url_for('items.new') }}">发布商品</a>
      <a href="{{ url_for('items.mine') }}">我的商品</a>
      <a href="{{ url_for('social.favorites') }}">我的收藏</a>
      <a href="{{ url_for('orders.index') }}">我的订单</a>
      {% if g.user['role'] == 'admin' %}<a href="{{ url_for('admin.index') }}">后台</a>{% endif %}
      <form class="inline" method="post" action="{{ url_for('auth.logout') }}">
        <button class="linkbtn" type="submit">退出（{{ g.user['nickname'] }}）</button>
      </form>
    {% else %}
      <a href="{{ url_for('auth.login') }}">登录</a>
      <a href="{{ url_for('auth.register') }}">注册</a>
    {% endif %}
  </nav>
</header>
<main>
{% for category, message in get_flashed_messages(with_categories=true) %}
  <p class="flash {{ category }}">{{ message }}</p>
{% endfor %}
{% block content %}{% endblock %}
</main>
<footer>信息系统项目管理实训 · 先跑再说队 · v2.0</footer>
</body>
</html>
