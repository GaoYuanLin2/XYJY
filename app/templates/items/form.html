{% extends "base.html" %}
{% block title %}{{ '修改商品' if item else '发布商品' }}{% endblock %}
{% block content %}
<section class="card form-card">
  <h2>{{ '修改商品（保存后重新审核）' if item else '发布商品' }}</h2>
  <form method="post" enctype="multipart/form-data">
    <label>标题<input name="title" value="{{ item['title'] if item else request.form.get('title', '') }}" required></label>
    <label>价格（元）<input name="price" type="number" step="0.01" min="0.01" value="{{ item['price'] if item else request.form.get('price', '') }}" required></label>
    <label>分类
      <select name="category">
        {% for name in categories %}
          <option value="{{ name }}" {% if item and item['category'] == name %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>成色
      <select name="condition">
        {% for name in conditions %}
          <option value="{{ name }}" {% if item and item['condition'] == name %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>描述<textarea name="description" rows="4">{{ item['description'] if item else request.form.get('description', '') }}</textarea></label>
    <label>图片（png/jpg/webp，不超过 4MB{{ '，不选则保留原图' if item else '' }}）
      <input type="file" name="image" accept="image/*">
    </label>
    <button class="btn" type="submit">提交</button>
  </form>
</section>
{% endblock %}
